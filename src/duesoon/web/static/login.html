<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · DueSoon</title><link rel="stylesheet" href="/assets/css/app.css"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">D</div><h1>Welcome to DueSoon</h1>
<p class="muted">Your private academic command center.</p><form id="login-form">
<label>Username<input id="username" autocomplete="username" required maxlength="100"></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
<button type="submit">Sign in</button><p id="login-error" class="error" role="alert"></p></form></main>
<script type="module" src="/assets/js/login.js"></script></body></html>
