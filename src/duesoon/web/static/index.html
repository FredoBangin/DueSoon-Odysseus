<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#282c34">
  <title>DueSoon</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <button id="sidebar-toggle" class="hamburger-btn" type="button" aria-label="Toggle navigation" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div id="mobile-backdrop" class="mobile-backdrop"></div>
  <aside class="sidebar" aria-label="DueSoon navigation">
    <div class="sidebar-header">
      <button class="sidebar-brand" type="button" data-view="home" title="DueSoon home"><span class="sidebar-brand-title">DueSoon</span><span class="sidebar-brand-subtitle">Odysseus academic workspace</span></button>
    </div>
    <div class="sidebar-inner">
      <nav id="nav" aria-label="Main">
        <p class="section-title">Academic</p>
        <button class="list-item active" type="button" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
        <button class="list-item" type="button" data-view="assistant"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Assistant</span></button>
        <button class="list-item" type="button" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>Calendar</span></button>
        <button class="list-item" type="button" data-view="email"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-9 6a2 2 0 0 1-2 0L2 7"/></svg><span>Email</span><span class="nav-state">read-only</span></button>
        <button class="list-item" type="button" data-view="notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>Notifications</span></button>
        <button class="list-item" type="button" data-view="review"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Review</span></button>
        <button class="list-item" type="button" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 15a2 2 0 0 0 .4 2l.1.1-2.8 2.8-.1-.1a2 2 0 0 0-2-.4 2 2 0 0 0-1.2 1.6V21h-4v-.1A2 2 0 0 0 8 19.3a2 2 0 0 0-2 .4l-.1.1-2.8-2.8.1-.1a2 2 0 0 0 .4-2A2 2 0 0 0 2 13.7V10h.1A2 2 0 0 0 3.7 8a2 2 0 0 0-.4-2l-.1-.1L6 3.1l.1.1a2 2 0 0 0 2 .4A2 2 0 0 0 9.3 2h4v.1A2 2 0 0 0 15 3.7a2 2 0 0 0 2-.4l.1-.1L20 6l-.1.1a2 2 0 0 0-.4 2A2 2 0 0 0 21 9.3V13h-.1A2 2 0 0 0 19 15z"/></svg><span>Settings</span></button>
      </nav>
      <nav class="retained" aria-label="Retained Odysseus tools">
        <p class="section-title">Retained from Odysseus</p>
        <button class="list-item" type="button" data-view="notes"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM15 3v5h5M8 17l7-7 2 2-7 7H8z"/></svg><span>Notes</span><span class="nav-state">later</span></button>
        <button class="list-item" type="button" data-view="memory"><svg viewBox="0 0 24 24"><path d="M12 5a3 3 0 1 0-6 0 4 4 0 0 0-2 7 4 4 0 0 0 8 1M12 5a3 3 0 1 1 6 0 4 4 0 0 1 2 7 4 4 0 0 1-8 1M12 5v14"/></svg><span>Memory</span><span class="nav-state">later</span></button>
        <button class="list-item" type="button" data-view="documents"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h6"/></svg><span>Documents</span><span class="nav-state">later</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-status"><span class="status-dot"></span><span id="sidebar-freshness">Checking Canvas</span></div>
      <button id="logout" class="list-item logout" type="button"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg><span>Sign out</span></button>
    </div>
  </aside>
  <main class="workspace">
    <header class="workspace-header"><div><p class="eyebrow">DueSoon</p><h1 id="page-title">Home</h1></div><span id="freshness" class="status-pill">Loading</span></header>
    <section id="content" class="workspace-content" aria-live="polite"></section>
  </main>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
