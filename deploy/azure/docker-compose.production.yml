services:
  duesoon:
    build:
      context: ../..
    env_file:
      - ${DUESOON_ENV_FILE:-/etc/duesoon/duesoon.env}
    environment:
      - DUESOON_ENV=production
      - DUESOON_DATABASE_URL=sqlite:///./data/duesoon.db
      - DUESOON_SCHEDULER_WORKERS=1
      - DUESOON_NTFY_URL=https://${DUESOON_PUBLIC_HOST:?DUESOON_PUBLIC_HOST is required}
    expose:
      - "7000"
    volumes:
      - /mnt/duesoon/app:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.27.0
    command: serve
    environment:
      - NTFY_BASE_URL=https://${DUESOON_PUBLIC_HOST:?DUESOON_PUBLIC_HOST is required}
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
      - NTFY_ENABLE_LOGIN=true
    expose:
      - "80"
    volumes:
      - /mnt/duesoon/ntfy-cache:/var/cache/ntfy
      - /mnt/duesoon/ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://127.0.0.1/v1/health -O - | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    depends_on:
      duesoon:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    environment:
      - DUESOON_PUBLIC_HOST=${DUESOON_PUBLIC_HOST:?DUESOON_PUBLIC_HOST is required}
      - ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/duesoon/caddy-data:/data
      - /mnt/duesoon/caddy-config:/config
    networks:
      default:
        aliases:
          - ${DUESOON_PUBLIC_HOST:?DUESOON_PUBLIC_HOST is required}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
