services:
  duesoon:
    build:
      context: .
    ports:
      - "${DUESOON_BIND:-127.0.0.1}:${DUESOON_PORT:-7000}:7000"
    environment:
      - DUESOON_ENV=${DUESOON_ENV:-development}
      - DUESOON_DATABASE_URL=sqlite:///./data/duesoon.db
      - DUESOON_DRY_RUN=${DUESOON_DRY_RUN:-true}
      - DUESOON_SCHEDULER_ENABLED=${DUESOON_SCHEDULER_ENABLED:-false}
      - DUESOON_SCHEDULER_WORKERS=1
      - DUESOON_CANVAS_ENABLED=${DUESOON_CANVAS_ENABLED:-false}
      - DUESOON_CANVAS_BASE_URL=${DUESOON_CANVAS_BASE_URL:-}
      - DUESOON_CANVAS_ACCESS_TOKEN=${DUESOON_CANVAS_ACCESS_TOKEN:-}
      - DUESOON_CANVAS_TIMEOUT_SECONDS=${DUESOON_CANVAS_TIMEOUT_SECONDS:-15}
      - DUESOON_CANVAS_MAX_ATTEMPTS=${DUESOON_CANVAS_MAX_ATTEMPTS:-3}
      - DUESOON_API_TOKEN=${DUESOON_API_TOKEN:-}
      - DUESOON_NTFY_ENABLED=${DUESOON_NTFY_ENABLED:-false}
      - DUESOON_NTFY_URL=${DUESOON_NTFY_URL:-http://ntfy:80}
      - DUESOON_NTFY_TOPIC=${DUESOON_NTFY_TOPIC:-}
      - DUESOON_NTFY_TOKEN=${DUESOON_NTFY_TOKEN:-}
      - DUESOON_NTFY_TIMEOUT_SECONDS=${DUESOON_NTFY_TIMEOUT_SECONDS:-10}
    volumes:
      - ${DUESOON_DATA_DIR:-duesoon-data}:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.27.0
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:${NTFY_PORT:-8091}:80"
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
      - NTFY_UPSTREAM_BASE_URL=${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=${NTFY_BEHIND_PROXY:-false}
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://127.0.0.1/v1/health -O - | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  duesoon-data:
  ntfy-cache:
  ntfy-data:
